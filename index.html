<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingala Kondareddy | Data Analyst & MIS Executive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              cyan: '#06b6d4',
              emerald: '#10b981',
              indigo: '#6366f1',
              amber: '#f59e0b',
              dark: '#060913',
              card: '#0f172a'
            }
          },
          animation: {
            'float-slow': 'float 8s ease-in-out infinite',
            'float-delayed': 'float 10s ease-in-out 3s infinite',
            'pulse-glow': 'pulseGlow 6s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
              '50%': { transform: 'translateY(-14px) rotate(2deg)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: 0.35 },
              '50%': { opacity: 0.65 },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Analytical Data Grid Background */
    .data-grid-bg {
      background-size: 36px 36px;
      background-image: 
        linear-gradient(to right, rgba(6, 182, 212, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(16, 185, 129, 0.07) 1px, transparent 1px);
    }
    .dark .data-grid-bg {
      background-image: 
        linear-gradient(to right, rgba(6, 182, 212, 0.09) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(99, 102, 241, 0.09) 1px, transparent 1px);
    }
    .gradient-text {
      background: linear-gradient(135deg, #06b6d4 0%, #10b981 50%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-card {
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-brand-dark dark:text-slate-100 data-grid-bg transition-colors duration-300 relative overflow-x-hidden">

  <!-- Ambient Glowing Analytics Orbs -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full bg-cyan-500/20 dark:bg-cyan-500/15 blur-3xl animate-pulse-glow"></div>
    <div class="absolute top-1/3 -right-28 w-[28rem] h-[28rem] rounded-full bg-emerald-500/20 dark:bg-emerald-500/15 blur-3xl animate-pulse-glow"></div>
    <div class="absolute bottom-10 left-1/4 w-96 h-96 rounded-full bg-indigo-500/15 dark:bg-indigo-500/15 blur-3xl animate-pulse-glow"></div>
  </div>

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-brand-dark/80 glass-card">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="#" class="flex items-center gap-2.5 group">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500 via-emerald-500 to-indigo-600 flex items-center justify-center text-white font-bold font-mono shadow-lg shadow-cyan-500/25">
          LK
        </div>
        <div>
          <span class="font-bold tracking-tight text-slate-900 dark:text-white text-sm sm:text-base block leading-none">LINGALA KONDAREDDY</span>
          <span class="text-[11px] font-mono text-cyan-600 dark:text-cyan-400">Data Analyst & MIS</span>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600 dark:text-slate-300">
